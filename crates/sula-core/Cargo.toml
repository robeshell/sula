[package]
name = "sula-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sula application core: libraries, tasks, scraping, organizing, config and logs, independent of any UI shell"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
media-core.workspace = true
renamer.workspace = true
reqwest.workspace = true
scraper-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
