[package]
name = "sula"
version.workspace = true
description = "Sula desktop shell (Tauri)"
authors = ["sula"]
edition.workspace = true
license.workspace = true

[lib]
name = "sula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
media-core.workspace = true
renamer.workspace = true
scraper-kit.workspace = true
serde.workspace = true
sula-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"

tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"

tauri-plugin-single-instance = "2.4.5"
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[dev-dependencies]
tempfile = "3"
