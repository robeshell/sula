[workspace]
resolver = "2"
members = [
    "crates/media-core",
    "crates/scraper-kit",
    "crates/renamer",
    "crates/sula-core",
    "desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
version = "1.0.1"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
media-core = { path = "crates/media-core" }
renamer = { path = "crates/renamer" }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper-kit = { path = "crates/scraper-kit" }
sula-core = { path = "crates/sula-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
md-5 = "0.10"
dirs = "6"

# Keep source locations in backtraces without full type/variable debug data.
[profile.dev]
debug = "line-tables-only"

# Third-party dependencies dominate debug output; enable their debug data only
# when stepping into dependency internals. Workspace crates keep the setting above.
[profile.dev.package."*"]
debug = false
